<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc4e4; font-family: system-ui, sans-serif; }

  #hud { position: fixed; left: 12px; top: 10px; color: #fff; font-size: 13px; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }

  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.45); color: #fff; font-size: 22px; cursor: pointer; text-align: center; line-height: 1.6; }
</style>

<div id="cross"></div>
<div id="start">클릭해서 시작<br><small>WASD 이동 · Shift 달리기 · Space 점프 · F 비행 모드 · Esc 일시정지</small></div>
<script type="module" src="src/main.js"></script>
